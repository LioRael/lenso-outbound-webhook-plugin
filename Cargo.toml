[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-outbound-webhook",
    "crates/lenso-capability-outbound-webhook-admin",
    "crates/lenso-outbound-webhook-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/LioRael/lenso-outbound-webhook-plugin"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
hmac = "0.12"
lenso = "0.5.0"
lenso-capability-http-client = "0.2.2"
lenso-capability-secrets = "0.1.2"
lenso-contract-authoring = "0.1.1"
lenso-contract-codegen = "=0.6.4"
lenso-contract-runtime = "0.1.3"
lenso-kernel = "0.2.0"
lenso-plugin-authoring = "0.1.1"
lenso-postgres-kit = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "time"] }
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
url = "2.5"
zeroize = "1.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
